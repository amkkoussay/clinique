<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" rx="32" fill="#ffffff"/>
<text x="60" y="65" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#0f172a">n8n Workflows</text>
<text x="60" y="100" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Simple automations around the clinic system.</text>
<g font-family="Arial,sans-serif">
 <text x="60" y="155" font-size="24" font-weight="700" fill="#db2777">1. Appointment event</text>
 <g transform="translate(60 180)">
  <rect width="190" height="100" rx="18" fill="#fdf2f8" stroke="#f472b6"/><text x="30" y="45" font-size="19">Webhook</text><text x="30" y="72" font-size="15" fill="#64748b">created / cancelled</text>
  <path d="M190 50h55" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="245" width="190" height="100" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="275" y="45" font-size="19">Format</text><text x="275" y="72" font-size="15" fill="#64748b">email data</text>
  <path d="M435 50h55" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="490" width="190" height="100" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="520" y="45" font-size="19">Send Email</text><text x="520" y="72" font-size="15" fill="#64748b">confirmation</text>
 </g>
 <text x="60" y="350" font-size="24" font-weight="700" fill="#db2777">2. 24h reminder</text>
 <g transform="translate(60 375)">
  <rect width="190" height="100" rx="18" fill="#fdf2f8" stroke="#f472b6"/><text x="30" y="45" font-size="19">Every hour</text><text x="30" y="72" font-size="15" fill="#64748b">Cron</text>
  <path d="M190 50h55" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="245" width="190" height="100" rx="18" fill="#f8fafc" stroke="#cbd5e1"/><text x="275" y="45" font-size="19">Flask API</text><text x="275" y="72" font-size="15" fill="#64748b">due reminders</text>
  <path d="M435 50h55" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="490" width="190" height="100" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="520" y="45" font-size="19">Send Email</text><text x="520" y="72" font-size="15" fill="#64748b">reminder</text>
  <path d="M680 50h55" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
  <rect x="735" width="190" height="100" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/><text x="765" y="45" font-size="19">Mark sent</text><text x="765" y="72" font-size="15" fill="#64748b">avoid duplicates</text>
 </g>
 <text x="60" y="550" font-size="22" font-weight="700" fill="#0f172a">Rule: Flask owns clinic data. n8n only runs automation.</text>
</g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
</svg>
