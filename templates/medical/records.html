{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Medical Records</h2>
    <table class="table">
        <thead><tr><th>Date</th><th>Patient</th><th>Diagnosis</th></tr></thead>
        <tbody>{% for record in records %}<tr><td>{{ record.visit_date }}</td><td>{{ record.patient.get_full_name() }}</td><td>{{ record.primary_diagnosis }}</td></tr>{% endfor %}</tbody>
    </table>
</div>
{% endblock %}
