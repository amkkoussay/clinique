{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Manage Users</h2>
    <table class="table">
        <thead><tr><th>Name</th><th>Role</th></tr></thead>
        <tbody>{% for user in users %}<tr><td>{{ user.get_full_name() }}</td><td>{{ user.role }}</td></tr>{% endfor %}</tbody>
    </table>
</div>
{% endblock %}
