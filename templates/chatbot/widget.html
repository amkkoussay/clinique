<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }
        .widget-header {
            background: #2563eb;
            color: white;
            padding: 0.75rem 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .widget-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .msg {
            max-width: 80%;
            padding: 0.5rem 0.75rem;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .msg.bot {
            background: white;
            border: 1px solid #e2e8f0;
            align-self: flex-start;
        }
        .msg.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
        }
        .widget-input {
            display: flex;
            padding: 0.75rem;
            border-top: 1px solid #e2e8f0;
            background: white;
            gap: 0.5rem;
        }
        .widget-input input {
            flex: 1;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            outline: none;
        }
        .widget-input button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1rem;
        }
        .widget-input button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="widget-header">💬 Clinic Assistant</div>
    <div class="widget-messages" id="messages">
        <div class="msg bot">Hi! How can I help you today?</div>
    </div>
    <div class="widget-input">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = 'msg ' + sender;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            inputEl.value = '';
            sendBtn.disabled = true;

            try {
                const res = await fetch('/chatbot/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                if (data.response) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage('Sorry, something went wrong.', 'bot');
                }
            } catch (err) {
                addMessage('Unable to connect. Please try again.', 'bot');
            } finally {
                sendBtn.disabled = false;
            }
        }

        inputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
