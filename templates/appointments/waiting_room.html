{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>Waiting Room</h2>
    <table class="table">
        <thead><tr><th>Patient</th><th>Status</th></tr></thead>
        <tbody>{% for apt in appointments %}<tr><td>{{ apt.patient.get_full_name() }}</td><td>{{ apt.status }}</td></tr>{% endfor %}</tbody>
    </table>
</div>
{% endblock %}
